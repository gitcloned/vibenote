<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vibenote</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Tab switcher -->
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="capture" role="tab" aria-selected="true">Capture</button>
    <button class="tab" data-tab="notes" role="tab" aria-selected="false">Notes</button>
  </nav>

  <!-- Capture view -->
  <main class="page" id="page-capture">
    <!-- Page preview card: shows what you're capturing from -->
    <section class="preview" id="preview">
      <div class="preview-favicon">
        <img id="favicon" alt="" width="16" height="16">
        <div class="preview-favicon-fallback" aria-hidden="true"></div>
      </div>
      <div class="preview-text">
        <div
          class="preview-title"
          id="title"
          contenteditable="true"
          spellcheck="false"
          data-placeholder="Page title"></div>
        <div class="preview-url" id="url" title=""></div>
      </div>
    </section>

    <!-- Thread picker -->
    <section class="field">
      <label class="field-label" for="thread">Save to</label>
      <div class="select-wrap">
        <select id="thread" class="select">
          <option value="">✨ Auto — let Vibenote decide</option>
        </select>
      </div>
      <div class="field-hint" id="thread-hint"></div>
    </section>

    <!-- Note textarea -->
    <section class="field field-grow">
      <label class="field-label" for="content">Your note</label>
      <textarea
        id="content"
        placeholder="Drop a thought, paste a quote, or anything from the page…"
        spellcheck="true"
        autofocus></textarea>
    </section>

    <!-- Capture action -->
    <section class="page-action">
      <span class="shortcut"><kbd>⌘</kbd><kbd>↵</kbd></span>
      <button id="save" class="btn-primary">
        <span class="btn-label">Capture</span>
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8l3 3 7-7"/>
          </svg>
        </span>
      </button>
    </section>
  </main>

  <!-- Notes view — chat interface -->
  <main class="page page-chat" id="page-notes" hidden>
    <!-- Minimal thread picker -->
    <div class="chat-scope">
      <div class="select-wrap select-wrap-compact">
        <select id="ask-thread" class="select select-compact">
          <option value="">Loading…</option>
        </select>
      </div>
    </div>

    <!-- Scrollable message area -->
    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-icon">💭</div>
        <div class="chat-empty-text">Ask anything about your captured thinking.<br>Try a quick query below.</div>
      </div>
    </div>

    <!-- Pinned input bar at bottom -->
    <div class="chat-input-bar">
      <div class="chat-chips" id="chat-chips">
        <button class="chip" data-query-type="where-am-i">
          <span class="chip-icon">🧭</span> Where am I
        </button>
        <button class="chip" data-query-type="open-questions">
          <span class="chip-icon">📋</span> Open questions
        </button>
        <button class="chip" data-query-type="next-steps">
          <span class="chip-icon">🎯</span> Next steps
        </button>
      </div>
      <div class="chat-input-row">
        <textarea
          id="question"
          class="chat-textarea"
          placeholder="Ask something…"
          spellcheck="true"
          rows="1"></textarea>
        <button id="ask-submit" class="chat-send" title="Send (⌘↵)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Global footer: status + config info -->
  <footer>
    <div class="footer-left">
      <span class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-text">Connecting…</span>
      </span>
    </div>
    <div class="footer-right">
      <span class="version-indicator" id="version-indicator"></span>
      <span class="config-indicator" id="config-indicator"></span>
    </div>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
